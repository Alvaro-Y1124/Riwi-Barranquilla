<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Meta tags for character encoding and responsive design -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Hobbies - Alvaro Noriega</title>
    <!-- Main stylesheet -->
    <link rel="stylesheet" href="./../assets/style/style.css">
    <link rel="stylesheet" href="./../assets/style/hobbies.css">
    <link  rel="icon" href="./../assets/img/letra-a.png">
</head>

<body class="body body--hobbies">
    <!-- Background gradient image -->
    <img class="background-gradient" src="./../assets/img/gradient.png" alt="gradient background">
    <!-- Blur layer effect -->
    <section class="blur-layer"></section>

    <!-- Main container wrapper -->
    <section class="main-container">
        <!-- Header section with navigation -->
        <header class="header_index">
            <h1 class="header__logo">Alvaro</h1>
            <!-- Main navigation -->
            <nav class="header__nav">
                <a class="header__nav-link" href="./../pages/index.html">Home</a>
                <a class="header__nav-link" href="./../pages/about.html">About</a>
                <a class="header__nav-link header__nav-link--active" href="./../pages/hobbies.html">Hobbies</a>
                <a class="header__nav-link" href="./../pages/contact.html">Contact</a>
            </nav>
        </header>

        <!-- Main content area -->
        <main class="main-content main-content--hobbies">
            <!-- Hobbies section -->
            <section class="hobbies-section">
                <!-- Section header -->
                <header class="hobbies-section__header">
                    <h2 class="hobbies-section__title">My hobbies</h2>
                    <p class="hobbies-section__description">In my spare time I like to do the following:</p>
                </header>

                <!-- Hobbies list -->
                <section class="hobbies-list">
                    <!-- Gaming hobby article -->
                    <article class="hobby-item">
                        <header class="hobby-item__header">
                            <h2 class="hobby-item__title">Play videogames</h2>
                        </header>
                        <figure class="hobby-item__figure">
                            <img class="hobby-item__image" 
                                src="./../assets/img/istockphoto-1334436084-612x612.jpg" 
                                alt="Video gaming illustration">
                        </figure>
                    </article>

                    <!-- Communication hobby article -->
                    <article class="hobby-item">
                        <header class="hobby-item__header">
                            <h2 class="hobby-item__title">Talk to my girlfriend</h2>
                        </header>
                        <figure class="hobby-item__figure">
                            <img class="hobby-item__image" 
                                src="./../assets/img/hablar-por-el-movil-marck-and-markus.jpg" 
                                alt="Person talking on mobile phone">
                        </figure>
                    </article>

                    <!-- Coding hobby article -->
                    <article class="hobby-item">
                        <header class="hobby-item__header">
                            <h2 class="hobby-item__title">Study coding</h2>
                        </header>
                        <figure class="hobby-item__figure">
                            <img class="hobby-item__image" 
                                src="./../assets/img/img-_iStock_LLMs_coding.jpg" 
                                alt="Coding and programming illustration">
                        </figure>
                    </article>
                </section>
            </section>
        </main>

        <!-- Footer section -->
        <footer class="footer">
            <p class="footer__copyright">&copy; Developed by Alvaro Noriega - All rights reserved</p>
        </footer>
    </section>
</body>
</html>
