<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Interface with Data Persistence</title>
    <link rel="stylesheet" href="./assets/style/style.css">
</head>

<body>
    <main class="container">
        <h1>Interactive Interface with Data Persistence</h1>

        <!-- Form to capture name and age -->
        <form id="userForm">
            <div class="form-group">
                <label for="userName">Name:</label>
                <input type="text" id="userName" name="userName" placeholder="Ingresa tu nombre">
                <div id="nameError" class="error-message"></div>
            </div>

            <div class="form-group">
                <label for="userAge">Age:</label>
                <input type="number" id="userAge" name="userAge" min="1" max="120" placeholder="Ingresa tu edad">
                <div id="ageError" class="error-message"></div>
            </div>

            <div class="button-group">
                <button type="button" id="saveDataBtn" class="btn-primary">Save Data</button>
                <button type="button" id="clearDataBtn" class="btn-secondary">Clear Data</button>
            </div>

            <div id="messageContainer"></div>
        </form>

        <!-- Section for displaying stored data -->
        <div class="output-section">
            <h3>Stored Data:</h3>
            <div id="output">
                <p class="no-data">No information stored</p>
            </div>
        </div>

        <!-- Interaction counter -->
        <div class="counter-section">
            <h3>Interaction Counter:</h3>
            <div id="interactionCounter">
                <p>Interactions in this session: <span id="counterValue">0</span></p>
            </div>
        </div>
    </main>

    <!-- Include JavaScript file -->
    <script src="./assets/src/main.js"></script>
</body>

</html>
