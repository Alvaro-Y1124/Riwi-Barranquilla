<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Management</title>
    <link rel="stylesheet" href="./style/style.css">
</head>
<body>
    <div class="container">
        <h1>Customer Management</h1>

        <div class="form-container">
            <h2>Client Form</h2>
            <form id="customer-form">
                <input type="hidden" id="customer-id">
                <div class="form-group">
                    <label for="identification_number">Identification Number:</label>
                    <input type="text" id="identification_number" required>
                </div>
                <div class="form-group">
                    <label for="client_names">Names:</label>
                    <input type="text" id="client_names" required>
                </div>
                <div class="form-group">
                    <label for="phone">Phone:</label>
                    <input type="text" id="phone" required>
                </div>
                <div class="form-group">
                    <label for="email">Email:</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="address">Address:</label>
                    <input type="text" id="address" required>
                </div>
                <div class="form-buttons">
                    <button type="submit" class="btn btn-primary">Keep</button>
                    <button type="button" id="cancel-edit" class="btn btn-secondary" style="display: none;">Cancel</button>
                </div>
            </form>
        </div>

        <div class="search-container">
            <h2>Search Client</h2>
            <div class="form-group">
                <label for="search-identification">Search by ID Number:</label>
                <input type="text" class="label" id="search-identification" placeholder="Ingrese el número de identificación">
                <button id="search-btn" class="btn btn-primary">Look for</button>
                <button id="reset-btn" class="btn btn-secondary">Clear Search</button>
            </div>
        </div>

        <div class="table-container">
            <h2>Client List</h2>
            <table id="customers-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>No. Identification</th>
                        <th>Names</th>
                        <th>Phone</th>
                        <th>Email</th>
                        <th>Address</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Las filas de clientes se insertarán aquí dinámicamente -->
                </tbody>
            </table>
        </div>
    </div>

    <script src="./src/app.js"></script>
</body>
</html>
